<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bouncing Ball Box</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: radial-gradient(circle, #0f172a 0%, #0b1021 60%, #06070c 100%);
        color: #e5e7eb;
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }

      .frame {
        width: min(1200px, 95vw);
        height: min(720px, 70vh);
        border-radius: 1rem;
        background: linear-gradient(135deg, #0c101f, #06070c);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 18px 80px rgba(0, 0, 0, 0.6);
        position: relative;
        overflow: hidden;
      }

      header {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 1rem 1.25rem;
        pointer-events: none;
      }

      h1 {
        margin: 0;
        font-size: 1.1rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.85);
      }

      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <header>
        <h1>Bouncing Ball Play Area</h1>
      </header>
      <canvas id="playArea" aria-label="Boxed bouncing ball"></canvas>
    </div>

    <script>
      const canvas = document.getElementById('playArea');
      const ctx = canvas.getContext('2d');

      let width = 0;
      let height = 0;
      let lastTime = performance.now();

      const ball = {
        x: 160,
        y: 160,
        radius: 16,
        vx: 180,
        vy: -160,
        gravity: 480,
        bounce: 0.86,
      };

      function resizeCanvas() {
        const parent = canvas.parentElement;
        if (!parent) return;
        const nextWidth = parent.clientWidth;
        const nextHeight = parent.clientHeight;

        if (nextWidth === width && nextHeight === height) return;

        width = nextWidth;
        height = nextHeight;
        canvas.width = width;
        canvas.height = height;

        // Keep the ball inside the new bounds.
        ball.x = Math.min(Math.max(ball.radius, ball.x), width - ball.radius);
        ball.y = Math.min(Math.max(ball.radius, ball.y), height - ball.radius);
      }

      function drawBackground() {
        const bg = ctx.createLinearGradient(0, 0, width, height);
        bg.addColorStop(0, '#0f172a');
        bg.addColorStop(1, '#0b1021');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, width, height);

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.22)';
        ctx.lineWidth = 2;
        ctx.strokeRect(8, 8, width - 16, height - 16);
      }

      function drawBall() {
        const glow = ctx.createRadialGradient(
          ball.x,
          ball.y,
          ball.radius * 0.2,
          ball.x,
          ball.y,
          ball.radius * 1.6,
        );
        glow.addColorStop(0, 'rgba(110, 231, 255, 0.95)');
        glow.addColorStop(1, 'rgba(79, 70, 229, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius * 1.6, 0, Math.PI * 2);
        ctx.fill();

        const fill = ctx.createRadialGradient(
          ball.x - ball.radius * 0.4,
          ball.y - ball.radius * 0.35,
          4,
          ball.x,
          ball.y,
          ball.radius,
        );
        fill.addColorStop(0, '#e7ff6b');
        fill.addColorStop(1, '#7f9728');
        ctx.fillStyle = fill;
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fill();
      }

      function step(timestamp) {
        const delta = Math.min(0.05, (timestamp - lastTime) / 1000);
        lastTime = timestamp;

        resizeCanvas();
        drawBackground();

        // Physics.
        ball.vy += ball.gravity * delta;
        ball.x += ball.vx * delta;
        ball.y += ball.vy * delta;

        const left = ball.radius;
        const right = width - ball.radius;
        const top = ball.radius;
        const bottom = height - ball.radius;

        if (ball.x < left) {
          ball.x = left;
          ball.vx = Math.abs(ball.vx) * ball.bounce;
        } else if (ball.x > right) {
          ball.x = right;
          ball.vx = -Math.abs(ball.vx) * ball.bounce;
        }

        if (ball.y < top) {
          ball.y = top;
          ball.vy = Math.abs(ball.vy) * ball.bounce;
        } else if (ball.y > bottom) {
          ball.y = bottom;
          ball.vy = -Math.abs(ball.vy) * ball.bounce;
        }

        drawBall();
        requestAnimationFrame(step);
      }

      function init() {
        resizeCanvas();
        lastTime = performance.now();
        window.addEventListener('resize', resizeCanvas);
        requestAnimationFrame(step);
      }

      init();
    </script>
  </body>
</html>
