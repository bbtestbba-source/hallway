<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bouncing Ball Box</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: radial-gradient(circle, #0f172a 0%, #0b1021 60%, #06070c 100%);
        color: #e5e7eb;
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }

      .frame {
        width: min(1200px, 95vw);
        height: min(720px, 70vh);
        border-radius: 1rem;
        background: linear-gradient(135deg, #0c101f, #06070c);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 18px 80px rgba(0, 0, 0, 0.6);
        position: relative;
        overflow: hidden;
      }

      header {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 1rem 1.25rem;
        pointer-events: none;
      }

      h1 {
        margin: 0;
        font-size: 1.1rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.85);
      }

      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <header>
        <h1>Bouncing Ball Play Area</h1>
      </header>
      <canvas id="playArea" aria-label="Boxed bouncing ball"></canvas>
    </div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
